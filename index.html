    <script>
      (function() {
        try {
          var cookies = document.cookie ? document.cookie.split('; ') : [];
          var mode = null;
          for (var i = 0; i < cookies.length; i++) {
            if (cookies[i].indexOf('theme_mode=') === 0) {
              mode = decodeURIComponent(cookies[i].split('=')[1]);
              break;
            }
          }
          if (!mode) {
            mode = localStorage.getItem('theme_mode');
          }
          var isDark = mode === 'dark' || (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
